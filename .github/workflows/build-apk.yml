name: Build APK and Play bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.TIJORI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No TIJORI_KEYSTORE_BASE64 secret. Building with debug key."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TIJORI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests (RFC 9106 Argon2id, RFC 5869 HKDF, RFC 6238 TOTP, Shamir, vault format)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Build signed release APK
        env:
          TIJORI_KEYSTORE_PASSWORD: ${{ secrets.TIJORI_KEYSTORE_PASSWORD }}
          TIJORI_KEY_ALIAS: ${{ secrets.TIJORI_KEY_ALIAS }}
          TIJORI_KEY_PASSWORD: ${{ secrets.TIJORI_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Tijori-v2.0.${{ github.run_number }}.apk"
          cp "app/build/outputs/apk/release/Tijori-v2.0.${{ github.run_number }}.apk" app/build/outputs/apk/release/Tijori.apk

      - name: Verify merged release manifest has zero INTERNET permission (Spec Page 10 Privacy Gate)
        run: |
          MANIFEST="app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            MANIFEST=$(find app/build/intermediates/merged_manifest -name "AndroidManifest.xml" | head -n 1)
          fi
          echo "Checking merged manifest: $MANIFEST"
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "::error::PRIVACY VIOLATION: Merged release manifest contains android.permission.INTERNET!"
            exit 1
          fi
          echo "Verified: Zero android.permission.INTERNET in merged release manifest."

      - name: Build signed release bundle (.aab) for Google Play
        if: env.TIJORI_KEYSTORE_PATH != ''
        env:
          TIJORI_KEYSTORE_PASSWORD: ${{ secrets.TIJORI_KEYSTORE_PASSWORD }}
          TIJORI_KEY_ALIAS: ${{ secrets.TIJORI_KEY_ALIAS }}
          TIJORI_KEY_PASSWORD: ${{ secrets.TIJORI_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --console=plain
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/Tijori-v2.0.${{ github.run_number }}.aab"

      - name: Upload Play bundle (.aab)
        if: env.TIJORI_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: Tijori-play-bundle-v2.0.${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tijori-v2.0.${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release (signed builds on main only)
        if: success() && env.TIJORI_KEYSTORE_PATH != '' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Tijori 2.0.${{ github.run_number }}
          make_latest: true
          files: |
            app/build/outputs/apk/release/Tijori.apk
            app/build/outputs/apk/release/Tijori-v2.0.${{ github.run_number }}.apk
          body: |
            **Tijori — Chaabi sirf aapke paas.**
            Offline password, banking and family vault for India.
            No accounts, no servers, and **ships without the INTERNET permission** (verified by CI on every build).
